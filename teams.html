<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAMS — Beer Beach Balls</title>
<meta name="description" content="Find your partner for the Beer Beach Ball Olympics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Righteous&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍻</text></svg>">
<style>
  :root {
    --pink: #ff2d95; --cyan: #00e5ff; --orange: #ff9e00; --yellow: #ffe600; --green: #3ee07a;
    --deep: #0d021f; --card: rgba(255,255,255,0.06); --border: rgba(0,229,255,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--deep); color: #f0eaff; overflow-x: hidden; padding-bottom: 3rem;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(255,45,149,0.16), transparent 55%); }
  nav { position: sticky; top: 0; z-index: 100; background: rgba(13,2,31,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; }
  nav a { font-family: 'Righteous', cursive; color: var(--cyan); text-decoration: none; font-size: 1rem; }
  nav .links { display: flex; gap: 0.9rem; }
  nav .links a { font-family: 'Inter'; font-size: 0.8rem; font-weight: 600; color: #f0eaff; opacity: 0.85; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.4rem 1rem; }
  h1 { font-family: 'Monoton', cursive; font-weight: 400; color: var(--pink); font-size: clamp(2.2rem, 10vw, 3.6rem);
    text-align: center; text-shadow: 0 0 18px rgba(255,45,149,0.6); line-height: 1.1; }
  .sub { text-align: center; opacity: 0.8; font-size: 0.9rem; margin: 0.4rem 0 1.4rem; }
  h2 { font-family: 'Righteous', cursive; font-weight: 400; color: var(--cyan); font-size: 1.2rem; letter-spacing: 0.06em; margin: 1.8rem 0 0.7rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; }
  .hero { border: 2px solid var(--pink); box-shadow: 0 0 22px rgba(255,45,149,0.25); }
  label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); margin-bottom: 0.3rem; }
  input { width: 100%; padding: 0.75rem 0.9rem; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.35);
    color: #fff; font-size: 1rem; font-family: inherit; }
  input:focus { outline: none; border-color: var(--pink); }
  .row { display: flex; gap: 0.7rem; margin-bottom: 0.8rem; }
  .row > div { flex: 1; }
  .row > .num { flex: 0 0 6.5rem; }
  button { font-family: 'Righteous', cursive; font-size: 1rem; border: none; border-radius: 10px; cursor: pointer; padding: 0.75rem 1.1rem; }
  .primary { width: 100%; background: linear-gradient(135deg, var(--pink), var(--orange)); color: #fff; box-shadow: 0 0 14px rgba(255,45,149,0.45); }
  .primary:disabled { opacity: 0.45; box-shadow: none; }
  .ghost { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); }
  .dice { background: rgba(255,230,0,0.12); color: var(--yellow); border: 1px solid var(--yellow); white-space: nowrap; }
  .link { background: none; border: none; color: var(--cyan); font-family: 'Inter'; font-size: 0.8rem; text-decoration: underline; padding: 0; opacity: 0.8; }
  .me-num { font-family: 'Righteous', cursive; color: var(--yellow); font-size: 0.85rem; letter-spacing: 0.08em; }
  .me-team { font-family: 'Righteous', cursive; font-size: clamp(1.4rem, 6vw, 2rem); color: var(--pink); line-height: 1.15; margin: 0.2rem 0 0.5rem; word-break: break-word; }
  .me-mates { font-size: 1.05rem; line-height: 1.5; }
  .me-mates b { color: var(--cyan); }
  .waiting { color: var(--orange); font-weight: 700; }
  .namebox { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .namebox .row { margin-bottom: 0.5rem; align-items: flex-end; }
  .hint { font-size: 0.75rem; opacity: 0.6; margin-top: 0.4rem; }
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.7rem; }
  .team { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 0.9rem; }
  .team.mine { border-color: var(--pink); box-shadow: 0 0 14px rgba(255,45,149,0.3); }
  .team.solo { border-style: dashed; opacity: 0.8; }
  .team .n { font-family: 'Righteous', cursive; color: var(--yellow); font-size: 0.8rem; }
  .team .tn { font-family: 'Righteous', cursive; color: var(--pink); font-size: 1.1rem; margin: 0.15rem 0 0.35rem; word-break: break-word; }
  .team .ppl { font-size: 0.9rem; line-height: 1.45; }
  .team .ppl .w { color: var(--orange); font-size: 0.8rem; }
  .team .who { background: none; border: none; padding: 0; color: inherit; font: inherit; font-size: 0.9rem; cursor: pointer; text-align: left; }
  .empty { opacity: 0.6; font-size: 0.9rem; text-align: center; padding: 1rem; }
  .xgames { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
  .game { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem; text-align: center; font-weight: 700; }
  .game .e { font-size: 1.6rem; display: block; margin-bottom: 0.2rem; }
  .game small { display: block; font-weight: 600; opacity: 0.55; font-size: 0.72rem; margin-top: 0.2rem; }
  .status { font-size: 0.72rem; opacity: 0.55; text-align: center; margin-top: 0.8rem; }
  .status.err { color: var(--orange); opacity: 1; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(0,229,255,0.15); border: 1px solid var(--cyan);
    color: var(--cyan); padding: 0.6rem 1.2rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; }
  .mini { width: 100%; display: flex; align-items: center; gap: 0.8rem; text-align: left; color: inherit; font-family: 'Inter'; border: 1px solid var(--pink); padding: 0.7rem 0.9rem; }
  .mini-num { font-family: 'Righteous', cursive; color: var(--yellow); font-size: 1.3rem; }
  .mini-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mini-team { font-family: 'Righteous', cursive; color: var(--pink); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-mates { font-size: 0.8rem; opacity: 0.85; }
  .mini-mates b { color: var(--cyan); }
  .mini-chev { color: var(--cyan); font-size: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip { font-family: 'Inter'; font-weight: 700; font-size: 0.85rem; padding: 0.5rem 0.75rem; border-radius: 999px; background: rgba(255,255,255,0.05);
    color: #f0eaff; border: 1px solid rgba(255,255,255,0.18); }
  .chip.on { background: rgba(255,45,149,0.2); border-color: var(--pink); color: #fff; }
  .st-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid rgba(0,229,255,0.15); }
  .st-row:last-child { border-bottom: none; }
  .st-row.mine .st-name { color: var(--pink); }
  .st-rank { font-family: 'Righteous', cursive; color: var(--yellow); width: 1.4rem; text-align: center; font-size: 1.1rem; }
  .st-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .st-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-sub { font-size: 0.75rem; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-rec { font-size: 0.8rem; opacity: 0.7; }
  .st-tok { font-family: 'Righteous', cursive; color: var(--cyan); font-size: 1.15rem; min-width: 3rem; text-align: right; }
  .res { display: flex; gap: 0.7rem; align-items: flex-start; background: var(--card); border: 1px solid rgba(0,229,255,0.2); border-radius: 12px; padding: 0.7rem 0.8rem; margin-bottom: 0.5rem; }
  .res-e { font-size: 1.4rem; line-height: 1.2; }
  .res-body { flex: 1; font-size: 0.9rem; line-height: 1.4; }
  .res-body b { color: var(--green); }
  .res-meta { display: block; font-size: 0.72rem; opacity: 0.6; }
  .undo { background: none; color: rgba(255,255,255,0.4); padding: 0.2rem 0.4rem; font-size: 0.9rem; font-family: 'Inter'; }
  .primary:disabled { opacity: 0.45; box-shadow: none; }

  /* Brackets */
  .btabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
  .btab { font-family: 'Inter'; font-weight: 700; font-size: 0.82rem; padding: 0.45rem 0.8rem; border-radius: 999px;
    background: var(--card); color: #f0eaff; border: 1px solid var(--border); }
  .btab.on { background: rgba(255,45,149,0.18); border-color: var(--pink); color: #fff; }
  .btab .st { font-size: 0.7rem; opacity: 0.7; margin-left: 0.25rem; }
  .bracket { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 0.4rem; }
  .rounds { display: flex; gap: 0.9rem; min-width: min-content; }
  .round { display: flex; flex-direction: column; width: 11.5rem; flex: 0 0 auto; }
  .round h4 { font-family: 'Righteous', cursive; font-weight: 400; color: var(--cyan); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .round .ms { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 0.6rem; }
  .match { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; position: relative; }
  .match.ready { border-color: var(--green); box-shadow: 0 0 10px rgba(62,224,122,0.25); }
  .match.mine { border-color: var(--pink); }
  .slot { display: flex; align-items: center; gap: 0.4rem; width: 100%; padding: 0.5rem 0.6rem; background: none; border: none; color: #f0eaff;
    font-family: 'Inter'; font-size: 0.82rem; font-weight: 600; text-align: left; border-radius: 0; min-height: 2.3rem; }
  .slot + .slot { border-top: 1px solid rgba(255,255,255,0.08); }
  .slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.tbd .nm { opacity: 0.35; font-style: italic; }
  .slot.win { background: rgba(62,224,122,0.14); color: var(--green); }
  .slot.win .nm::after { content: ' ✓'; }
  .slot.lose { opacity: 0.4; text-decoration: line-through; }
  .match.ready .slot { cursor: pointer; }
  .match.ready .slot:active { background: rgba(255,45,149,0.2); }
  .mfoot { display: flex; justify-content: space-between; align-items: center; font-size: 0.68rem; opacity: 0.6; padding: 0.15rem 0.6rem 0.35rem; }
  .mfoot .undo { font-size: 0.75rem; padding: 0 0.2rem; }
  .res .edit { font-size: 0.8rem; }
  .modal { position: fixed; inset: 0; z-index: 300; background: rgba(5,0,15,0.75); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
  .modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: #170530; border: 1px solid var(--pink); border-bottom: none;
    border-radius: 18px 18px 0 0; padding: 1.1rem 1rem calc(1.2rem + env(safe-area-inset-bottom)); }
  .sheet h3 { font-family: 'Righteous', cursive; font-weight: 400; color: var(--pink); font-size: 1.2rem; margin-bottom: 0.3rem; }
  .sheet .note { font-size: 0.78rem; opacity: 0.65; margin-bottom: 0.8rem; }
  .sheet .btnrow { display: flex; gap: 0.6rem; margin-top: 1rem; }
  .sheet .btnrow .primary { flex: 1; }
  .champ { text-align: center; margin: 0.4rem 0 0.8rem; font-family: 'Righteous', cursive; font-size: 1.3rem; color: var(--yellow); text-shadow: 0 0 14px rgba(255,230,0,0.5); }
  .bnote { font-size: 0.75rem; opacity: 0.65; margin-top: 0.6rem; display: flex; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
  .tap-hint { font-size: 0.78rem; color: var(--green); margin-bottom: 0.6rem; }
</style>
</head>

<nav>
  <a href="index.html">🏖️ BEERBEACHBALLS</a>
  <div class="links"><a href="pickem.html">Pick 'Em</a><a href="board.html">Scoreboard</a></div>
</nav>

<div class="wrap">
  <h1>TEAMS</h1>
  <div class="sub">Find your partner, name your team, log your wins. 1 token per win.</div>

  <div id="me"></div>

  <h2 id="bracketsAnchor">🏆 BRACKETS</h2>
  <div id="brackets"></div>

  <h2>🏁 LOG A GAME</h2>
  <div class="sub" style="text-align:left;margin:-0.4rem 0 0.6rem">For anything outside the brackets. A bracket matchup logged here counts in the bracket too.</div>
  <div class="card" id="logCard"></div>

  <h2>🏆 LAWN GAMES STANDINGS</h2>
  <div id="standings"></div>

  <h2>📜 RESULTS</h2>
  <div id="feed"></div>

  <h2>🍻 ALL TEAMS</h2>
  <div id="teams" class="teams"></div>

  <div class="status" id="status">Connecting…</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="editModal" hidden><div class="sheet" id="editSheet"></div></div>

<script src="teams.js?v=1452"></script>
<script>
const ME_KEY = 'bbb_teams_me', MIN_KEY = 'bbb_teams_min';
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private browsing: fine, it's saved on the board */ } } };
let me = store.get(ME_KEY);                 // { id, name, num }
if (me && me.id && !me.id.startsWith('n:')) me.id = Teams.idFor(me.name);
let minimized = store.get(MIN_KEY);         // null = decide automatically
let editingJoin = false;
const log = { game: null, other: '', winner: null, losers: new Set(), score: '' };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const timeStr = t => new Date(t * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

/* ---------- Team name generator (bachelor party grade) ---------- */
const FULL = [
  'Two Pumps and a Dump', 'Sloppy Seconds', 'Balls Deep', 'The Master Baiters', 'Tea Baggers Anonymous', 'Nice Putt, Nice Butt',
  'Shaft and Furious', 'Kiss My Putts', 'The Pong Dongs', 'Cup Fondlers', 'Blue Shell Bangers', 'Hole in One Night Stand',
  'Beer Pong Johnsons', 'Flip Cup Floppers', 'Premature Celebrators', 'The Taint Tickets', 'Cornhole Connoisseurs',
  'Bag Tossers', 'Wet Willies', 'The Morning Wood Chucks', 'Nut Busters', 'Shots and Thots', 'Drunk in Love (Handles)',
  'The Last Tan Lines', 'Buttchuggers United', 'The Rainbow Road Ragers', 'Tee Baggers', 'Dick Vitale Fan Club',
  'Hot Dog Water', 'Big Beach Balls Energy', 'The Double Bogey Boners', 'Justin’s Last Hall Pass', 'Hung Over Achievers',
  'Well Hung Jury', 'The Swamp Crotch Society', 'Hairy Pong Hitters', 'Moist Towelettes', 'Captain Morgan’s Mistakes'
];
const ADJ = ['Sloppy', 'Moist', 'Throbbing', 'Sweaty', 'Limp', 'Thirsty', 'Loose', 'Hairy', 'Swollen', 'Greasy', 'Chafed', 'Dirty',
  'Horny', 'Premature', 'Soggy', 'Hammered', 'Salty', 'Crusty', 'Rock Hard', 'Floppy', 'Well Hung', 'Wasted', 'Shameless', 'Buttered'];
const NOUN = ['Sausages', 'Beavers', 'Wieners', 'Nuts', 'Buns', 'Cocktails', 'Taints', 'Shafts', 'Dingleberries', 'Knobs', 'Johnsons',
  'Gooch Goblins', 'Ball Sacks', 'Butt Cheeks', 'Nipples', 'Hot Dogs', 'Meat Sticks', 'Beer Bellies', 'Boners', 'Bagpipes', 'Weenies', 'Jugs'];
const pick = a => a[Math.floor(Math.random() * a.length)];
function genName() { return Math.random() < 0.5 ? pick(FULL) : `The ${pick(ADJ)} ${pick(NOUN)}`; }

/* ---------- My card ---------- */
function renderMe() {
  const all = Teams.teams();
  const mine = me && all.find(t => t.num === me.num);
  const el = document.getElementById('me');
  if (!me || editingJoin) {
    el.innerHTML = `<div class="card hero">
      <div class="row">
        <div><label for="jName">Your name</label><input id="jName" maxlength="30" placeholder="e.g. Big Steve" value="${esc(me ? me.name : '')}" autocomplete="off"></div>
        <div class="num"><label for="jNum">Hat #</label><input id="jNum" type="number" inputmode="numeric" min="1" max="99" placeholder="7" value="${me ? me.num : ''}"></div>
      </div>
      <button class="primary" id="joinBtn">FIND MY PARTNER</button>
      <div class="hint" style="text-align:center">Already signed in on another phone or tab? Just tap your name under All Teams.</div>
      ${editingJoin ? '<div style="text-align:center;margin-top:0.7rem"><button class="link" id="cancelEdit">cancel</button></div>' : ''}
    </div>`;
    const btn = document.getElementById('joinBtn');
    const upd = () => btn.disabled = !(document.getElementById('jName').value.trim() && +document.getElementById('jNum').value > 0);
    ['jName', 'jNum'].forEach(id => document.getElementById(id).addEventListener('input', upd)); upd();
    btn.addEventListener('click', join);
    if (editingJoin) document.getElementById('cancelEdit').addEventListener('click', () => { editingJoin = false; renderMe(); });
    return;
  }
  const mates = mine ? mine.members.filter(m => m.id !== me.id) : [];
  const tname = mine && mine.name;
  const isMin = minimized === null ? !!tname : minimized;
  const mateLine = mates.length ? `with ${mates.map(m => `<b>${esc(m.name)}</b>`).join(' & ')}` : `<span class="waiting">waiting on your partner</span>`;
  if (isMin) {
    el.innerHTML = `<button class="card mini" id="expand">
      <span class="mini-num">#${me.num}</span>
      <span class="mini-body"><span class="mini-team">${tname ? esc(tname) : 'Unnamed team'}</span><span class="mini-mates">${esc(me.name)} ${mateLine}</span></span>
      <span class="mini-chev">▾</span></button>`;
    document.getElementById('expand').addEventListener('click', () => { minimized = false; store.set(MIN_KEY, false); renderMe(); });
    return;
  }
  el.innerHTML = `<div class="card hero">
    <div class="hero-top"><div class="me-num">YOU'RE HAT #${me.num}</div><button class="link" id="collapse">minimize ▴</button></div>
    <div class="me-team">${tname ? esc(tname) : 'Unnamed team'}</div>
    <div class="me-mates">${mates.length
      ? `Your partner${mates.length > 1 ? 's' : ''}: ${mates.map(m => `<b>${esc(m.name)}</b>`).join(' & ')}`
      : `<span class="waiting">Waiting for whoever else drew #${me.num} to sign in…</span>`}</div>
    <div class="namebox">
      <div class="row">
        <div><label for="tName">Team name</label><input id="tName" maxlength="40" placeholder="Name your team" value="${esc(tname || '')}" autocomplete="off"></div>
        <button class="dice" id="genBtn" title="Generate a name">🎲</button>
      </div>
      <button class="primary" id="saveName">SAVE TEAM NAME</button>
      <div class="hint">Either partner can change it. 🎲 generates something your mother wouldn't approve of.</div>
    </div>
    <div style="text-align:center;margin-top:0.9rem"><button class="link" id="editJoin">Not ${esc(me.name)} or wrong number? Change it</button></div>
  </div>`;
  document.getElementById('collapse').addEventListener('click', () => { minimized = true; store.set(MIN_KEY, true); renderMe(); });
  document.getElementById('genBtn').addEventListener('click', () => { document.getElementById('tName').value = genName(); });
  document.getElementById('saveName').addEventListener('click', saveTeamName);
  document.getElementById('editJoin').addEventListener('click', () => { editingJoin = true; renderMe(); });
}

/* ---------- Log a game ---------- */
function renderLog() {
  const all = Teams.teams();
  const el = document.getElementById('logCard');
  if (all.length < 2) { el.innerHTML = `<div class="empty">Once two teams have signed in, log games here.</div>`; return; }
  if (log.winner === null && me && all.some(t => t.num === me.num)) log.winner = me.num;
  const chip = (on, attrs, text) => `<button class="chip${on ? ' on' : ''}" ${attrs}>${text}</button>`;
  el.innerHTML = `
    <label>Game</label>
    <div class="chips">${Teams.GAMES.map(g => chip(log.game === g.id, `data-game="${g.id}"`, `${g.emoji} ${g.name}`)).join('')}
      ${chip(log.game === 'other', 'data-game="other"', '🎯 Other')}</div>
    ${log.game === 'other' ? `<input id="otherGame" maxlength="30" placeholder="What game? (e.g. Kan Jam, Stump)" value="${esc(log.other)}" style="margin-top:0.5rem">` : ''}
    <label style="margin-top:0.9rem">🏆 Winner</label>
    <div class="chips">${all.map(t => chip(log.winner === t.num, `data-win="${t.num}"`, esc(Teams.label(t.num)))).join('')}</div>
    <label style="margin-top:0.9rem">💀 Beat <span style="text-transform:none;letter-spacing:0;opacity:.6;font-weight:600">(pick everyone who lost, e.g. all 3 in Mario Kart)</span></label>
    <div class="chips">${all.filter(t => t.num !== log.winner).map(t => chip(log.losers.has(t.num), `data-lose="${t.num}"`, esc(Teams.label(t.num)))).join('')}</div>
    <label style="margin-top:0.9rem" for="score">Score <span style="text-transform:none;letter-spacing:0;opacity:.6;font-weight:600">(optional)</span></label>
    <input id="score" maxlength="30" placeholder="e.g. 21-15, 2 cups left" value="${esc(log.score)}">
    <button class="primary" id="logBtn" style="margin-top:1rem">LOG IT</button>`;
  el.querySelectorAll('[data-game]').forEach(b => b.addEventListener('click', () => { log.game = b.dataset.game; renderLog(); }));
  el.querySelectorAll('[data-win]').forEach(b => b.addEventListener('click', () => { log.winner = +b.dataset.win; log.losers.delete(log.winner); renderLog(); }));
  el.querySelectorAll('[data-lose]').forEach(b => b.addEventListener('click', () => { const n = +b.dataset.lose; log.losers.has(n) ? log.losers.delete(n) : log.losers.add(n); renderLog(); }));
  const other = document.getElementById('otherGame'); if (other) other.addEventListener('input', () => { log.other = other.value; upd(); });
  const score = document.getElementById('score'); score.addEventListener('input', () => { log.score = score.value; });
  const btn = document.getElementById('logBtn');
  const upd = () => btn.disabled = !(log.game && (log.game !== 'other' || log.other.trim()) && log.winner && log.losers.size);
  upd();
  btn.addEventListener('click', submitResult);
}

async function submitResult() {
  const btn = document.getElementById('logBtn'); btn.disabled = true; btn.textContent = 'LOGGING…';
  const game = log.game === 'other' ? log.other.trim() : log.game;
  try {
    await Teams.send({ t: 'result', rid: Teams.newRid(), game, winner: log.winner, losers: [...log.losers], score: log.score.trim(), by: me ? me.name : '' });
    toast(`🪙 Token to ${Teams.label(log.winner)}`);
    log.game = null; log.other = ''; log.losers = new Set(); log.score = ''; log.winner = me ? me.num : null;
    renderAll();
  } catch (e) { btn.disabled = false; btn.textContent = 'LOG IT'; toast('Couldn’t save. Try again'); }
}

/* ---------- Brackets ---------- */
const BGAMES = Teams.GAMES.filter(g => g.bracket);
let bGame = BGAMES[0].id;
function renderBrackets() {
  const el = document.getElementById('brackets');
  const tabs = BGAMES.map(g => {
    const br = Teams.bracket(g.id);
    const st = !br ? '' : br.champion ? '👑' : Teams.upNext().some(m => m.game === g.id) ? '●' : '';
    return `<button class="btab${bGame === g.id ? ' on' : ''}" data-bg="${g.id}">${g.emoji} ${g.name}${st ? `<span class="st">${st}</span>` : ''}</button>`;
  }).join('');
  const g = Teams.gameInfo(bGame);
  const br = Teams.bracket(bGame);
  const ready = Teams.teams().filter(t => t.members.length);
  let body;
  if (!br) {
    body = `<div class="card" style="text-align:center">
      <p style="font-size:0.9rem;opacity:0.85;margin-bottom:0.8rem">No ${esc(g.name)} bracket yet. Starting one shuffles the ${ready.length} team${ready.length === 1 ? '' : 's'} signed in right now into a random single-elimination bracket.</p>
      <button class="primary" id="startB" ${ready.length < 2 ? 'disabled' : ''}>START ${esc(g.name.toUpperCase())} BRACKET</button>
      ${ready.length < 2 ? '<div class="hint">Need at least 2 teams signed in.</div>' : ''}
    </div>`;
  } else {
    const L = n => n ? esc(Teams.label(n)) : '';
    const slot = (m, n) => {
      if (!n) return `<div class="slot tbd"><span class="nm">${m.bye && m.round === 0 ? 'bye' : 'TBD'}</span></div>`;
      const cls = m.winner ? (m.winner === n ? ' win' : ' lose') : '';
      return `<button class="slot${cls}" data-m="${m.id}" data-t="${n}"><span class="nm">${L(n)}</span></button>`;
    };
    const cols = br.rounds.map(r => `<div class="round"><h4>${r.name}</h4><div class="ms">${r.matches.map(m => {
      const isReady = m.a && m.b && !m.winner;
      const mine = me && (m.a === me.num || m.b === me.num);
      if (m.bye) return `<div class="match"><div class="slot win"><span class="nm">${L(m.a)}</span></div><div class="mfoot"><span>bye</span></div></div>`;
      return `<div class="match${isReady ? ' ready' : ''}${mine ? ' mine' : ''}">${slot(m, m.a)}${slot(m, m.b)}
        ${m.winner ? `<div class="mfoot"><span>${esc(m.score || 'final')}</span>${m.rid ? `<span><button class="undo" data-bedit="${m.rid}" title="Edit">✏️</button><button class="undo" data-undo="${m.rid}" title="Delete">✕</button></span>` : ''}</div>` : ''}</div>`;
    }).join('')}</div></div>`).join('');
    body = `${br.champion ? `<div class="champ">👑 ${L(br.champion)} 👑</div>` : `<div class="tap-hint">Green = ready to play. When it's done, tap the winner.</div>`}
      <div class="bracket"><div class="rounds">${cols}</div></div>
      <div class="bnote"><span>${br.seeds.length} teams · random draw${br.by ? ' · started by ' + esc(br.by) : ''}</span><button class="link" id="restartB">Restart / reshuffle</button></div>`;
  }
  el.innerHTML = `<div class="btabs">${tabs}</div>${body}`;
  el.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => { bGame = b.dataset.bg; renderBrackets(); }));
  const start = document.getElementById('startB'); if (start) start.addEventListener('click', () => startBracket(false));
  const restart = document.getElementById('restartB'); if (restart) restart.addEventListener('click', () => startBracket(true));
  el.querySelectorAll('.match.ready .slot[data-t]').forEach(b => b.addEventListener('click', () => pickWinner(b.dataset.m, +b.dataset.t)));
  el.querySelectorAll('[data-bedit]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.bedit)));
  el.querySelectorAll('[data-undo]').forEach(b => b.addEventListener('click', async () => {
    if (!askCode('Delete this result? Later rounds that depended on it reset too.')) return;
    try { await Teams.send({ t: 'void', rid: b.dataset.undo, by: me ? me.name : '' }); toast('Undone'); } catch (e) { toast('Couldn’t undo. Try again'); }
  }));
}
async function startBracket(restart) {
  const g = Teams.gameInfo(bGame);
  const nums = Teams.teams().filter(t => t.members.length).map(t => t.num);
  if (nums.length < 2) return toast('Need at least 2 teams');
  if (!confirm(restart ? `Restart ${g.name}? This reshuffles all ${nums.length} current teams and wipes the bracket (logged wins still count as tokens).` : `Start the ${g.name} bracket with ${nums.length} teams?`)) return;
  for (let i = nums.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [nums[i], nums[j]] = [nums[j], nums[i]]; }
  try { await Teams.send({ t: 'bracket', bid: Teams.newRid(), game: bGame, seeds: nums, by: me ? me.name : '' }); toast(`${g.emoji} Bracket drawn`); }
  catch (e) { toast('Couldn’t start. Try again'); }
}
async function pickWinner(matchId, winner) {
  const br = Teams.bracket(bGame); if (!br) return;
  const m = br.rounds.flatMap(r => r.matches).find(x => x.id === matchId); if (!m || m.winner) return;
  const loser = m.a === winner ? m.b : m.a;
  if (!confirm(`${Teams.label(winner)} beat ${Teams.label(loser)}?`)) return;
  const score = (prompt('Score? (optional, e.g. 3 cups left)') || '').trim().slice(0, 30);
  try {
    await Teams.send({ t: 'result', rid: Teams.newRid(), game: bGame, winner, losers: [loser], score, by: me ? me.name : '', bid: br.bid, match: matchId });
    toast(`🪙 ${Teams.label(winner)} advances`);
  } catch (e) { toast('Couldn’t save. Try again'); }
}

/* ---------- Standings, feed, teams ---------- */
function renderStandings() {
  const rows = Teams.standings();
  const el = document.getElementById('standings');
  if (!rows.length) { el.innerHTML = `<div class="empty">No teams yet.</div>`; return; }
  el.innerHTML = `<div class="card" style="padding:0.3rem 0.9rem">${rows.map(r => {
    const games = Object.entries(r.byGame).map(([g, n]) => `${Teams.gameInfo(g).emoji}${n > 1 ? '×' + n : ''}`).join(' ');
    return `<div class="st-row${me && r.num === me.num ? ' mine' : ''}">
      <span class="st-rank">${r.wins ? r.rank : '–'}</span>
      <span class="st-who"><span class="st-name">${esc(r.name)}</span><span class="st-sub">${r.members.map(m => esc(m.name)).join(' & ') || 'Team #' + r.num}${games ? ' · ' + games : ''}</span></span>
      <span class="st-rec">${r.wins}-${r.losses}</span>
      <span class="st-tok">🪙 ${r.wins}</span>
    </div>`; }).join('')}</div>`;
}

function renderFeed() {
  const items = Teams.feed();
  const el = document.getElementById('feed');
  if (!items.length) { el.innerHTML = `<div class="empty">No games logged yet. Go win something.</div>`; return; }
  el.innerHTML = items.slice(0, 40).map(r => {
    const g = Teams.gameInfo(r.game);
    return `<div class="res">
      <span class="res-e">${g.emoji}</span>
      <span class="res-body"><b>${esc(Teams.label(r.winner))}</b> beat ${r.losers.map(n => esc(Teams.label(n))).join(', ')}
        <span class="res-meta">${r.bid ? '🏆 bracket · ' : ''}${esc(g.name)}${r.score ? ' · ' + esc(r.score) : ''} · ${timeStr(r.time)}${r.by ? ' · logged by ' + esc(r.by) : ''}${r.edited ? ' · ✏️ edited' + (r.editedBy ? ' by ' + esc(r.editedBy) : '') : ''}</span></span>
      <button class="undo edit" data-edit="${esc(r.rid)}" title="Edit">✏️</button>
      <button class="undo" data-rid="${esc(r.rid)}" title="Delete">✕</button>
    </div>`;
  }).join('') + (items.length > 40 ? `<div class="empty">+ ${items.length - 40} older</div>` : '');
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.edit)));
  el.querySelectorAll('.undo[data-rid]').forEach(b => b.addEventListener('click', async () => {
    if (!askCode('Delete this game from the scoreboard?')) return;
    try { await Teams.send({ t: 'void', rid: b.dataset.rid, by: me ? me.name : '' }); toast('Removed'); } catch (e) { toast('Couldn’t remove. Try again'); }
  }));
}

function renderTeams() {
  const all = Teams.teams().filter(t => t.members.length);
  const tEl = document.getElementById('teams');
  tEl.innerHTML = all.length ? all.map(t => `<div class="team${me && t.num === me.num ? ' mine' : ''}${t.members.length < 2 ? ' solo' : ''}">
      <div class="n">HAT #${t.num}</div>
      <div class="tn">${t.name ? esc(t.name) : '<span style="opacity:.5">no name yet</span>'}</div>
      <div class="ppl">${t.members.map(m => `<button class="who" data-id="${esc(m.id)}">${esc(m.name)}</button>`).join('<br>')}${t.members.length < 2 ? '<br><span class="w">waiting on partner</span>' : ''}</div>
    </div>`).join('') : `<div class="empty">No one's signed in yet. Be the first.</div>`;
  tEl.querySelectorAll('.who').forEach(b => b.addEventListener('click', () => {
    const p = Teams.people[b.dataset.id]; if (!p || p.gone || (me && me.id === b.dataset.id)) return;
    if (confirm(`Are you ${p.name}?`)) { me = { id: b.dataset.id, name: p.name, num: p.num }; store.set(ME_KEY, me); editingJoin = false; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }));
  const n = all.reduce((a, t) => a + t.members.length, 0);
  const st = document.getElementById('status');
  st.className = 'status' + (Teams.connected ? '' : ' err');
  st.textContent = Teams.connected ? `${n} signed in · ${all.filter(t => t.members.length >= 2).length} full teams · ${Teams.feed().length} games logged · updates live` : 'Reconnecting to the team board…';
}

function renderAll() {
  // don't clobber a field someone is typing in
  const a = document.activeElement;
  const typing = a && a.tagName === 'INPUT';
  if (!(typing && document.getElementById('me').contains(a))) renderMe();
  if (!(typing && document.getElementById('logCard').contains(a))) renderLog();
  renderBrackets(); renderStandings(); renderFeed(); renderTeams();
}

/* ---------- Deleting needs a passcode, so nobody does it by accident ---------- */
const DELETE_CODE = '5555';
function askCode(msg) {
  const v = prompt(msg + '\n\nEnter the passcode to delete:');
  if (v === null) return false;
  if (v.trim() !== DELETE_CODE) { toast('Wrong passcode. Nothing deleted'); return false; }
  return true;
}

/* ---------- Edit a logged game ---------- */
let ed = null; // { rid, game, other, winner, losers:Set, score, bracketPair:[a,b]|null }
function openEditor(rid) {
  const r = Teams.feed().find(x => x.rid === rid); if (!r) return toast('That game was removed');
  const known = Teams.GAMES.some(g => g.id === r.game);
  ed = { rid, game: known ? r.game : 'other', other: known ? '' : r.game, winner: r.winner, losers: new Set(r.losers), score: r.score || '',
         bracketPair: r.bid ? [r.winner, ...r.losers] : null };
  document.getElementById('editModal').hidden = false;
  renderEditor();
}
function closeEditor() { ed = null; document.getElementById('editModal').hidden = true; }
function renderEditor() {
  if (!ed) return;
  const el = document.getElementById('editSheet');
  const chip = (on, attrs, text) => `<button class="chip${on ? ' on' : ''}" ${attrs}>${text}</button>`;
  const all = Teams.teams();
  const pool = ed.bracketPair ? all.filter(t => ed.bracketPair.includes(t.num)) : all;
  el.innerHTML = `<h3>✏️ Edit game</h3>
    <div class="note">${ed.bracketPair ? 'Bracket match: you can flip the winner or fix the score. Later rounds update automatically.' : 'Fix anything that was logged wrong. Standings update for everyone.'}</div>
    ${ed.bracketPair ? '' : `<label>Game</label>
    <div class="chips">${Teams.GAMES.map(g => chip(ed.game === g.id, `data-eg="${g.id}"`, `${g.emoji} ${g.name}`)).join('')}${chip(ed.game === 'other', 'data-eg="other"', '🎯 Other')}</div>
    ${ed.game === 'other' ? `<input id="edOther" maxlength="30" placeholder="What game?" value="${esc(ed.other)}" style="margin-top:0.5rem">` : ''}`}
    <label style="margin-top:0.9rem">🏆 Winner</label>
    <div class="chips">${pool.map(t => chip(ed.winner === t.num, `data-ew="${t.num}"`, esc(Teams.label(t.num)))).join('')}</div>
    ${ed.bracketPair ? '' : `<label style="margin-top:0.9rem">💀 Beat</label>
    <div class="chips">${all.filter(t => t.num !== ed.winner).map(t => chip(ed.losers.has(t.num), `data-el="${t.num}"`, esc(Teams.label(t.num)))).join('')}</div>`}
    <label style="margin-top:0.9rem" for="edScore">Score <span style="text-transform:none;letter-spacing:0;opacity:.6;font-weight:600">(optional)</span></label>
    <input id="edScore" maxlength="30" value="${esc(ed.score)}" placeholder="e.g. 21-15">
    <div class="btnrow"><button class="ghost" id="edCancel">Cancel</button><button class="primary" id="edSave">SAVE CHANGES</button></div>`;
  el.querySelectorAll('[data-eg]').forEach(b => b.addEventListener('click', () => { ed.game = b.dataset.eg; renderEditor(); }));
  el.querySelectorAll('[data-ew]').forEach(b => b.addEventListener('click', () => {
    const n = +b.dataset.ew;
    if (ed.bracketPair) { ed.winner = n; ed.losers = new Set(ed.bracketPair.filter(x => x !== n)); }
    else { ed.winner = n; ed.losers.delete(n); }
    renderEditor();
  }));
  el.querySelectorAll('[data-el]').forEach(b => b.addEventListener('click', () => { const n = +b.dataset.el; ed.losers.has(n) ? ed.losers.delete(n) : ed.losers.add(n); renderEditor(); }));
  const other = document.getElementById('edOther'); if (other) other.addEventListener('input', () => { ed.other = other.value; });
  document.getElementById('edScore').addEventListener('input', e => { ed.score = e.target.value; });
  document.getElementById('edCancel').addEventListener('click', closeEditor);
  document.getElementById('edSave').addEventListener('click', saveEdit);
}
async function saveEdit() {
  const game = ed.game === 'other' ? ed.other.trim() : ed.game;
  if (!game) return toast('Pick a game');
  if (!ed.winner || !ed.losers.size) return toast('Pick a winner and who they beat');
  const btn = document.getElementById('edSave'); btn.disabled = true; btn.textContent = 'SAVING…';
  try {
    await Teams.send({ t: 'edit', rid: ed.rid, game, winner: ed.winner, losers: [...ed.losers], score: ed.score.trim(), by: me ? me.name : '' });
    closeEditor(); toast('Game updated ✔');
  } catch (e) { btn.disabled = false; btn.textContent = 'SAVE CHANGES'; toast('Couldn’t save. Try again'); }
}
document.getElementById('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeEditor(); });

/* ---------- Actions ---------- */
async function join() {
  const name = document.getElementById('jName').value.trim();
  const num = +document.getElementById('jNum').value;
  if (!name || !(num > 0)) return;
  const btn = document.getElementById('joinBtn'); btn.disabled = true; btn.textContent = 'SAVING…';
  try {
    const oldId = me && me.id;
    me = { id: Teams.idFor(name), name, num }; store.set(ME_KEY, me);
    editingJoin = false; log.winner = num;
    const p = Teams.people;
    if (oldId && oldId !== me.id && p[oldId] && !p[oldId].gone) await Teams.send({ t: 'leave', id: oldId });
    await Teams.send({ t: 'join', id: me.id, name, num });
    toast('You’re in ✔');
  } catch (e) { btn.disabled = false; btn.textContent = 'FIND MY PARTNER'; toast('Couldn’t save. Check your signal and try again'); }
}
async function saveTeamName() {
  const name = document.getElementById('tName').value.trim();
  if (!name) return toast('Type a name or hit 🎲');
  try { await Teams.send({ t: 'team', num: me.num, name, by: me.name }); minimized = true; store.set(MIN_KEY, true); toast('Team name saved ✔'); renderAll(); }
  catch (e) { toast('Couldn’t save. Try again'); }
}
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

Teams.onChange(renderAll);
renderAll();
Teams.start();
// If my sign-in aged out of the 12-hour window, re-post it
setTimeout(() => { if (me && Teams.connected && !Teams.people[me.id]) Teams.send({ t: 'join', id: me.id, name: me.name, num: me.num }).catch(() => {}); }, 6000);
</script>
</body>
</html>
